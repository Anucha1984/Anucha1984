<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:K;font-weight:400;src:url(node_modules/@fontsource/kanit/files/kanit-thai-400-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:600;src:url(node_modules/@fontsource/kanit/files/kanit-thai-600-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:800;src:url(node_modules/@fontsource/kanit/files/kanit-thai-800-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:400;src:url(node_modules/@fontsource/kanit/files/kanit-latin-400-normal.woff2)}
@font-face{font-family:K;font-weight:600;src:url(node_modules/@fontsource/kanit/files/kanit-latin-600-normal.woff2)}
@font-face{font-family:K;font-weight:800;src:url(node_modules/@fontsource/kanit/files/kanit-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0}
body{width:720px;height:1280px;overflow:hidden;background:#06060f;font-family:K;color:#fff}
#bg,#fx,#st{position:absolute;inset:0}
.abs{position:absolute}
.c{position:absolute;left:0;width:720px;text-align:center}
.gold{color:#f2c45a}
.card{background:#101a3acc;border:2px solid;border-radius:18px}
.chip{display:inline-block;padding:10px 26px;border-radius:999px;font-weight:600;font-size:34px;margin:8px}
.en{font-size:46px;font-weight:800;color:#f2c45a;margin:0 .22em}
.sub{position:absolute;left:40px;width:640px;top:835px;text-align:center;font-size:34px;font-weight:600;line-height:1.5;text-shadow:0 3px 10px #000,0 0 3px #000}
</style>
<div id="bg"></div><canvas id="fx" width="720" height="1280"></canvas><div id="st"></div>
<script src="scenes.js"></script><script src="timings.js"></script>
<script>
const W=720;
let acc=0; SCENES.forEach((s,i)=>{const T=(window.TIMINGS||[])[i];if(T)s.dur=T.dur;s.t0=acc;acc+=s.dur;
  const tot=s.subs.reduce((a,x)=>a+x.length+3,0);let p=0;s.pt=s.subs.map(x=>{const r=p/tot*s.dur;p+=x.length+3;return r});if(T)s.pt=T.pt.slice();s.pt.push(s.dur)});
const TOTAL=acc; window.TOTAL=TOTAL;
// seeded stars
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=[...Array(90)].map(()=>({x:rnd()*720,y:rnd()*1280,r:rnd()*1.6+.4,p:rnd()*6,s:rnd()*8+3}));
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// pop-in style: at local time lt since t0
function pop(lt,t0,d=.35){const x=(lt-t0)/d;if(x<=0)return'opacity:0;';return`opacity:${cl(x*3)};transform:scale(${back(x).toFixed(3)});`}
function rise(lt,t0,d=.4){const x=(lt-t0)/d;if(x<=0)return'opacity:0;';return`opacity:${cl(x*2)};transform:translateY(${((1-eo(x))*40).toFixed(1)}px);`}
function hexa(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const ph=(s,i,f=0)=>s.pt[i]+f*(s.pt[i+1]-s.pt[i]);

function header(s,lt){
  const lab=s.id==='tool'?`อันดับ ${s.rank}/5`:s.chip;
  return lab?`<div class="abs" style="left:40px;top:92px;background:${s.color};color:#fff;font-size:22px;font-weight:600;padding:3px 16px;border-radius:999px;${pop(lt,0.05)}transform-origin:left center">${lab}</div>`:'';
}
function hook(s,lt){
  const cols=SCENES.filter(x=>x.id==='tool');
  let h=`<div class="c gold" style="top:150px;font-size:150px;font-weight:800;line-height:1.1;transform:scale(${(1+.04*Math.sin(lt*3)).toFixed(3)})">AI 5 ตัว</div>
  <div class="c" style="top:330px;font-size:50px;font-weight:800;${rise(lt,ph(s,1),.3)}">ที่คนทั้งโลก<span class="gold">ใช้เยอะที่สุด</span></div>
  <div class="c" style="top:450px">`;
  cols.forEach((c,i)=>{h+=`<div style="display:inline-block;width:104px;height:104px;margin:0 8px;border-radius:24px;background:${c.color};font-size:64px;font-weight:800;line-height:104px;box-shadow:0 8px 30px ${hexa(c.color,.5)};${pop(lt,ph(s,2,i*.18))}">${i+1}</div>`});
  h+=`</div><div class="c" style="top:610px;font-size:46px;font-weight:800;${pop(lt,ph(s,3,.5))}"><span style="background:#f3ead8;color:#151a35;padding:8px 26px;border-radius:14px">งานไหน → ใช้ตัวไหน?</span></div>`;
  return h;
}
function tool(s,lt){
  let h=`<div class="abs" style="left:40px;top:140px;width:120px;height:120px;border-radius:60px;background:${s.color};border:5px solid #fff;font-size:76px;font-weight:800;text-align:center;line-height:108px;${pop(lt,0)}">${s.rank}</div>
  <div class="abs" style="left:184px;top:128px;font-size:76px;font-weight:800;line-height:1.25;white-space:nowrap;${rise(lt,.08,.3)}">${s.en.split(' ')[0]}</div>
  <div class="abs" style="left:188px;top:232px;font-size:28px;font-weight:600;color:${s.color};${rise(lt,.2,.3)}">${s.th}${s.en.includes('Google')?' · Google':''}</div>`;
  let y=320;
  if(s.stat){
    const tn=ph(s,s.stat.numPh), k=eo((lt-tn)/1.1), n=Math.round(5320*k);
    const tb=ph(s,s.stat.barPh), bw=eo((lt-tb)/.9)*52;
    h+=`<div class="abs card" style="left:40px;top:${y}px;width:640px;height:250px;border-color:${s.color};padding:18px 28px;${pop(lt,ph(s,s.stat.ph))}">
      <div style="font-size:28px;color:#cdd3ee">ยอดเข้าเว็บต่อเดือน</div>
      <div class="gold" style="font-size:86px;font-weight:800;line-height:1.15;opacity:${lt>tn?1:.15}">${n.toLocaleString('en')} <span style="font-size:44px">ล้านครั้ง</span></div>
      <div style="height:22px;background:#ffffff22;border-radius:11px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${bw}%;background:${s.color};border-radius:11px"></div></div>
      <div style="font-size:24px;color:#cdd3ee;margin-top:6px;opacity:${cl((lt-tb)*3)}">≈ 52% ของยอดรวมทั้งลิสต์</div></div>
      <div class="abs" style="left:44px;top:${y+256}px;font-size:18px;color:#8f97b8;${rise(lt,ph(s,s.stat.ph)+.3)}">ที่มา: Exploding Topics · ข้อมูล มิ.ย. 2026</div>`;
    y+=300;
  }
  h+=`<div class="abs" style="left:44px;top:${y}px;font-size:30px;font-weight:600;color:#cdd3ee;${rise(lt,ph(s,s.chipLabelPh))}">${s.chipLabel||'เหมาะกับ'}</div>
  <div class="abs" style="left:32px;top:${y+46}px;width:660px">`;
  s.chips.forEach(c=>{h+=`<span class="chip" style="${s.stat?'font-size:28px;padding:8px 20px;margin:6px;':''}background:${hexa(s.color,.22)};border:2px solid ${s.color};${pop(lt,ph(s,c.ph,c.f))}">${c.t}</span>`});
  h+=`</div>`;
  const py=s.stat?748:y+250;
  h+=`<div class="c" style="top:${py}px;${pop(lt,ph(s,s.punch.ph))}"><span style="display:inline-block;background:#f3ead8;color:#151a35;font-size:${s.stat?36:42}px;font-weight:800;padding:${s.stat?6:12}px 28px;border-radius:16px;border-bottom:5px solid ${s.color}">${s.punch.t}</span></div>`;
  return h;
}
function sum(s,lt){
  let h=`<div class="c gold" style="top:128px;font-size:62px;font-weight:800;${pop(lt,0)}">งานไหน ใช้ตัวไหน</div>
  <div class="c" style="top:222px;${pop(lt,ph(s,0,.45))}"><span style="background:#e2334a;font-size:26px;font-weight:600;padding:4px 18px;border-radius:8px;display:inline-block;transform:rotate(-3deg)">📸 แคปหน้าจอไว้เลย</span></div>`;
  s.rows.forEach((r,i)=>{const t0=ph(s,i+1), cur=lt>=t0&&lt<s.pt[i+2];
    h+=`<div class="abs" style="left:40px;top:${290+i*102}px;width:640px;height:88px;border-radius:16px;background:${hexa(r[2],cur?.38:.18)};border:2px solid ${r[2]};${rise(lt,t0,.35)}">
      <div class="abs" style="left:22px;top:24px;font-size:27px;font-weight:600;white-space:nowrap">${r[0]}</div>
      <div class="abs" style="right:18px;top:12px;background:${r[2]};font-size:42px;font-weight:800;padding:0 22px;border-radius:999px;${pop(lt,t0+.35)}">${r[1]}</div></div>`});
  return h;
}
function cta(s,lt){
  return `<div class="c" style="top:190px;font-size:64px;font-weight:800;line-height:1.3;${pop(lt,0)}">อย่าใช้ AI<br><span class="gold">แค่ตัวเดียว</span></div>
  <div class="abs" style="left:70px;top:470px;width:270px;height:120px;border-radius:20px;background:#f2c45a;color:#151a35;font-size:56px;font-weight:800;text-align:center;line-height:120px;${pop(lt,ph(s,0))}">🔖 เซฟ</div>
  <div class="abs" style="left:380px;top:470px;width:270px;height:120px;border-radius:20px;background:#e2334a;font-size:56px;font-weight:800;text-align:center;line-height:120px;${pop(lt,ph(s,1))}">↗ แชร์</div>
  <div class="c" style="top:640px;font-size:34px;font-weight:600;color:#cdd3ee;${rise(lt,ph(s,2))}">ให้เพื่อนที่ยังใช้ AI อยู่ตัวเดียว</div>`;
}
const EN=[['แชตจีพีที','ChatGPT'],['เจมิไน','Gemini'],['กูเกิลด็อกส์','Google Docs'],['กูเกิล','Google'],['จีเมล','Gmail'],['ไดรฟ์','Drive'],['คล็อด','Claude'],['แคนวา','Canva'],['ดีปซีก','DeepSeek'],['เอไอ','AI']];
function subHtml(t){let o=t;EN.forEach(([th,en],i)=>{o=o.split(th).join('\u0001'+i+'\u0002')});return o.replace(/\u0001(\d+)\u0002/g,(m,i)=>`<span class="en">${EN[+i][1]}</span>`)}
const R={hook,tool,sum,cta};
const ctx=document.getElementById('fx').getContext('2d');
window.renderAt=function(t){
  t=cl(t,0,TOTAL-.001);
  const s=SCENES.find(x=>t>=x.t0&&t<x.t0+x.dur), lt=t-s.t0;
  document.getElementById('bg').style.background=`radial-gradient(520px 420px at 50% 34%, ${hexa(s.color,.34)}, transparent 70%), linear-gradient(#0a0d24,#05050d)`;
  ctx.clearRect(0,0,720,1280);
  stars.forEach(a=>{ctx.globalAlpha=.25+.45*(.5+.5*Math.sin(t*1.3+a.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(a.x,(a.y-t*a.s+12800)%1280,a.r,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  let si=0;while(si<s.subs.length-1&&lt>=s.pt[si+1])si++;
  const fade=(s===SCENES[0]?1:cl(lt/.18))*cl((s.dur-lt)/.12+ (s===SCENES[SCENES.length-1]?1:0));
  document.getElementById('st').innerHTML=
   `<div class="abs" style="left:40px;top:76px;width:640px;height:4px;background:#ffffff26;border-radius:2px"><div style="width:${(t/TOTAL*100).toFixed(2)}%;height:100%;background:#f2c45a;border-radius:2px"></div></div>`
   +`<div style="opacity:${fade.toFixed(3)}">`+header(s,lt)+R[s.id](s,lt)+`</div>`
   +`<div class="sub" style="${pop(lt,s.pt[si],.16)}">${subHtml(s.subs[si])}</div>`;
};
</script>
