<!doctype html><meta charset="utf-8"><style>*{margin:0}body{width:720px;height:1280px;overflow:hidden;background:#0f1115}
#bg{position:absolute;inset:0;background:radial-gradient(640px 520px at 50% 40%,#1c2230,#0f1115 72%)}
#lg{position:absolute;left:40px;top:300px;width:640px;height:640px;border-radius:56px;overflow:hidden;box-shadow:0 30px 80px #000a}
#lg img{width:100%;height:100%;display:block}
#fl{position:absolute;inset:0;background:#fff;opacity:0}</style>
<div id="bg"></div><div id="lg"><img id="im"></div><div id="fl"></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), HIT=.25;
document.getElementById('im').src=new URLSearchParams(location.search).get('logo');
window.TOTAL=3.2;
window.renderAt=t=>{
  const x=t-HIT, lg=document.getElementById('lg');
  if(x<0){lg.style.opacity=0;document.getElementById('fl').style.opacity=0;document.body.style.transform='';return}
  const k=cl(x/.28), back=1+2.6*Math.pow(k-1,3)+1.6*Math.pow(k-1,2);          // overshoot pop
  const sh=Math.max(0,1-x/.45), dx=Math.sin(x*90)*18*sh, dy=Math.cos(x*77)*12*sh, rot=Math.sin(x*60)*3*sh;
  const idle=1+.012*Math.sin(x*5);
  lg.style.opacity=cl(x/.06);
  lg.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${(.35+.65*back)*idle})`;
  document.getElementById('fl').style.opacity=Math.max(0,.75*(1-x/.28));
  const out=cl((t-2.8)/.4);document.body.style.opacity=1-out;
};
</script>
